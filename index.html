<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f0f1a"/>
<title>VibhillionAI Tasks</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#22223a;--surface3:#2a2a42;
  --accent:#e94560;--text:#f0f0f8;--text2:#a0a0c0;--text3:#505070;
  --border:#2e2e4e;--success:#22c55e;--warning:#f59e0b;--info:#3b82f6;
  --radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:15px}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:700}.logo span{color:var(--accent)}
.role-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.role-badge.admin-badge{background:#e9456020;color:var(--accent);border-color:#e9456040}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:360px}
.login-title{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:20px}

/* TABS */
.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:99}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:90px;padding:14px 8px;font-size:13px;font-weight:700;color:var(--text2);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Nunito',sans-serif;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

.main{padding:16px;max-width:600px;margin:0 auto;width:100%}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-title{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;margin-bottom:12px}

/* FORM */
label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.04em}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14px;font-family:'Nunito',sans-serif;outline:none;transition:border 0.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.btn{padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:all 0.15s}
.btn:active{transform:scale(0.97)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#c73650}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn-danger{color:#ff6b6b;border-color:#ff6b6b33;background:transparent}
.btn-success{color:var(--success);border-color:#22c55e44;background:transparent}

/* TASK CARD */
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:border-color 0.2s}
.task-card.done{opacity:0.45}
.task-card:not(.done):hover{border-color:var(--accent)}
.tc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.tc-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all 0.2s;background:transparent}
.tc-check:hover{border-color:var(--success)}
.tc-check.checked{background:var(--success);border-color:var(--success)}
.tc-title{font-size:15px;font-weight:700;line-height:1.4;flex:1}
.tc-title.striked{text-decoration:line-through;color:var(--text2)}
.tc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700}
.b-assignee{background:#3b82f620;color:#60a5fa}
.b-high{background:#ef444420;color:#f87171}
.b-medium{background:#f59e0b20;color:#fbbf24}
.b-low{background:#22c55e20;color:#4ade80}
.b-done{background:#22c55e20;color:#4ade80}
.b-pending{background:#3b82f620;color:#60a5fa}
.b-overdue{background:#ef444430;color:#f87171}
.b-today{background:#f59e0b20;color:#fbbf24}
.tc-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:8px}
.tc-footer{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-date{font-size:11px;color:var(--text3)}
.tc-actions{display:flex;gap:6px;margin-left:auto}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-num{font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:700}
.stat-lbl{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:0.04em}

/* FILTER */
.filter-row{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-row::-webkit-scrollbar{display:none}
.fpill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'Nunito',sans-serif;white-space:nowrap}
.fpill.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* PROGRESS */
.prog-wrap{background:var(--surface2);border-radius:10px;height:6px;margin-top:6px;overflow:hidden}
.prog-bar{height:100%;background:var(--accent);border-radius:10px;transition:width 0.4s}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:8px}

/* MEMBER */
.member-header{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;text-align:center}
.member-name{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;color:var(--accent)}
.member-sub{font-size:13px;color:var(--text2);margin-top:4px}

/* TOAST */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none}
.toast{background:#1e1e3a;border:1px solid var(--border);color:var(--text);padding:10px 22px;border-radius:var(--radius);font-size:13px;font-weight:700;opacity:0;transition:opacity 0.3s;white-space:nowrap}
.toast.show{opacity:1}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:#00000099;z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:700;margin-bottom:16px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

.section-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}

.notif-bar{background:#3b82f620;border:1px solid #3b82f640;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:#60a5fa;display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}

@media(max-width:380px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" class="login-wrap">
  <div class="login-box">
    <div class="login-title">🔐 VibhillionAI Tasks</div>
    <div class="login-sub">Select your role to continue</div>

    <div class="field">
      <label>I am</label>
      <select id="login-role" onchange="toggleAdminPass()">
        <option value="">— select role —</option>
        <option value="admin">👑 Admin (Me)</option>
        <option value="member">👤 Team Member</option>
      </select>
    </div>

    <div class="field" id="admin-pass-field" style="display:none">
      <label>Admin Password</label>
      <input type="password" id="admin-pass" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>

    <div class="field" id="member-name-field" style="display:none">
      <label>Your Name</label>
      <select id="member-name-select">
        <option value="">— select your name —</option>
      </select>
    </div>

    <button class="btn btn-primary btn-full" onclick="doLogin()" style="margin-top:4px">Enter →</button>
    <div id="login-error" style="color:#f87171;font-size:13px;margin-top:10px;text-align:center"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-screen" style="display:none">
  <div class="header">
    <div class="logo"><span>Vibhillion</span>AI Tasks</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="role-badge" id="role-badge"></div>
      <button class="btn btn-sm" onclick="doLogout()" style="padding:5px 10px;font-size:11px">Exit</button>
    </div>
  </div>

  <!-- ADMIN TABS -->
  <div class="tabs" id="admin-tabs" style="display:none">
    <button class="tab-btn active" onclick="setTab('dashboard',this)">📊 Dashboard</button>
    <button class="tab-btn" onclick="setTab('create',this)">➕ New Task</button>
    <button class="tab-btn" onclick="setTab('team',this)">👥 Team</button>
  </div>

  <!-- MEMBER TABS -->
  <div class="tabs" id="member-tabs" style="display:none">
    <button class="tab-btn active" onclick="setTab('mytasks',this)">📋 My Tasks</button>
  </div>

  <div class="main">
    <div class="notif-bar" id="notif-bar" onclick="enableNotifs()" style="display:none">
      🔔 <span style="flex:1">Enable notifications to get task alerts</span> <strong>Enable →</strong>
    </div>

    <!-- DASHBOARD TAB -->
    <div id="tab-dashboard">
      <div class="stats-grid" id="stats-grid"></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px">
        <span>Team progress</span><span id="prog-pct">0%</span>
      </div>
      <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>
      <hr/>
      <div class="section-label">All Tasks</div>
      <div class="filter-row">
        <button class="fpill active" onclick="setFilter('all',this)">All</button>
        <button class="fpill" onclick="setFilter('pending',this)">Pending</button>
        <button class="fpill" onclick="setFilter('done',this)">Done</button>
        <button class="fpill" onclick="setFilter('high',this)">🔴 High</button>
        <button class="fpill" onclick="setFilter('overdue',this)">⚠️ Overdue</button>
      </div>
      <div id="admin-task-list"></div>
    </div>

    <!-- CREATE TASK TAB -->
    <div id="tab-create" style="display:none">
      <div class="card">
        <div class="card-title">➕ Create New Task</div>
        <div class="field"><label>Task Title *</label><input id="t-title" placeholder="e.g. Write 10 MCQs on Economy"/></div>
        <div class="field"><label>Description</label><textarea id="t-desc" placeholder="Instructions, links, details..."></textarea></div>
        <div class="row2">
          <div class="field"><label>Assign To</label>
            <select id="t-assign"><option value="">— select member —</option></select>
          </div>
          <div class="field"><label>Priority</label>
            <select id="t-priority">
              <option value="medium">🟡 Medium</option>
              <option value="high">🔴 High</option>
              <option value="low">🟢 Low</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Due Date (Optional)</label><input type="date" id="t-due"/></div>
        <button class="btn btn-primary btn-full" onclick="createTask()">Create Task</button>
      </div>
    </div>

    <!-- TEAM TAB -->
    <div id="tab-team" style="display:none">
      <div class="card">
        <div class="card-title">👥 Add Member</div>
        <div style="display:flex;gap:8px">
          <input id="new-member" placeholder="Member name e.g. Srinivas" style="flex:1" onkeydown="if(event.key==='Enter')addMember()"/>
          <button class="btn btn-primary" onclick="addMember()">Add</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🔑 Change Admin Password</div>
        <div class="field"><label>New Password</label><input type="password" id="new-pass" placeholder="Enter new password"/></div>
        <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
      </div>

      <div class="section-label">Team Members</div>
      <div id="member-list"></div>
    </div>

    <!-- MY TASKS TAB (member) -->
    <div id="tab-mytasks" style="display:none">
      <div id="member-task-content"></div>
    </div>

  </div>
</div>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ══════════════════════════════════════
// PASTE YOUR FIREBASE CONFIG HERE
// ══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyCUHBD8qaN8jXpVVbVk-dPbzoTj4rkKcxQ",
  authDomain: "vibhi-task.firebaseapp.com",
  databaseURL: "https://vibhi-task-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "vibhi-task",
  storageBucket: "vibhi-task.firebasestorage.app",
  messagingSenderId: "8326165037",
  appId: "1:8326165037:web:93d448c30062d0650cfea4"
};
// ══════════════════════════════════════

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Default admin password (change in Team tab after first login)
const DEFAULT_PASS = "vibhi2024";

window._tasks = {};
window._members = [];
window._role = null;
window._memberName = null;
window._adminFilter = 'all';

// ── Firebase listeners ─────────────────
onValue(ref(db,'tasks'), snap => {
  window._tasks = snap.val() || {};
  renderAll();
});

onValue(ref(db,'members'), snap => {
  window._members = snap.val() ? Object.values(snap.val()) : [];
  renderMemberSelects();
  renderMemberList();
  renderAll();
});

// ── Toast ──────────────────────────────
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}
window.toast = toast;

// ── Login ──────────────────────────────
window.toggleAdminPass = function(){
  const role = document.getElementById('login-role').value;
  document.getElementById('admin-pass-field').style.display = role==='admin'?'':'none';
  document.getElementById('member-name-field').style.display = role==='member'?'':'none';
  document.getElementById('login-error').textContent = '';
};

window.doLogin = async function(){
  const role = document.getElementById('login-role').value;
  const err = document.getElementById('login-error');
  if(!role){err.textContent='Select a role!';return;}

  if(role==='admin'){
    const pass = document.getElementById('admin-pass').value;
    // Get password from Firebase or use default
    const snap = await get(ref(db,'settings/adminPass'));
    const storedPass = snap.val() || DEFAULT_PASS;
    if(pass !== storedPass){err.textContent='❌ Wrong password!';return;}
    window._role = 'admin';
    window._memberName = 'Admin';
  } else {
    const name = document.getElementById('member-name-select').value;
    if(!name){err.textContent='Select your name!';return;}
    window._role = 'member';
    window._memberName = name;
  }

  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-screen').style.display='';

  if(window._role==='admin'){
    document.getElementById('admin-tabs').style.display='flex';
    document.getElementById('role-badge').textContent='👑 Admin';
    document.getElementById('role-badge').classList.add('admin-badge');
    setTab('dashboard', document.querySelector('#admin-tabs .tab-btn'));
  } else {
    document.getElementById('member-tabs').style.display='flex';
    document.getElementById('role-badge').textContent='👤 '+window._memberName;
    setTab('mytasks', document.querySelector('#member-tabs .tab-btn'));
    renderMemberTasks();
  }

  checkNotifBanner();
  toast('Welcome '+window._memberName+'! 👋');
};

window.doLogout = function(){
  window._role = null;
  window._memberName = null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('admin-tabs').style.display='none';
  document.getElementById('member-tabs').style.display='none';
  document.getElementById('admin-pass').value='';
  document.getElementById('login-role').value='';
  document.getElementById('admin-pass-field').style.display='none';
  document.getElementById('member-name-field').style.display='none';
};

// ── Populate member name select on login ─
function renderMemberSelects(){
  const loginSel = document.getElementById('member-name-select');
  const cur = loginSel.value;
  loginSel.innerHTML = '<option value="">— select your name —</option>' +
    window._members.map(m=>`<option value="${m}" ${cur===m?'selected':''}>${m}</option>`).join('');

  const assignSel = document.getElementById('t-assign');
  const cur2 = assignSel.value;
  assignSel.innerHTML = '<option value="">— select member —</option>' +
    window._members.map(m=>`<option value="${m}" ${cur2===m?'selected':''}>${m}</option>`).join('');
}

// ── Helpers ────────────────────────────
function taskArr(){ return Object.entries(window._tasks).map(([id,t])=>({id,...t})); }

function isOverdue(t){
  if(!t.due||t.status==='done') return false;
  const today=new Date(); today.setHours(0,0,0,0);
  return new Date(t.due)<today;
}

function dueBadge(due){
  if(!due) return '';
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(due);
  if(d<today) return '<span class="badge b-overdue">⚠️ Overdue</span>';
  if(d.toDateString()===today.toDateString()) return '<span class="badge b-today">📅 Today</span>';
  return `<span class="badge b-pending">📅 ${d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span>`;
}

function prioBadge(p){
  return `<span class="badge b-${p}">${p==='high'?'🔴 High':p==='medium'?'🟡 Medium':'🟢 Low'}</span>`;
}

// ── Stats ──────────────────────────────
function renderStats(){
  const all=taskArr(), total=all.length, done=all.filter(t=>t.status==='done').length, pct=total?Math.round(done/total*100):0;
  document.getElementById('stats-grid').innerHTML=`
    <div class="stat-box"><div class="stat-num">${total}</div><div class="stat-lbl">Total</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--warning)">${total-done}</div><div class="stat-lbl">Pending</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--success)">${done}</div><div class="stat-lbl">Done</div></div>`;
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'%';
}

// ── Admin task list ────────────────────
function renderAdminTasks(){
  const f=window._adminFilter;
  let list=taskArr();
  if(f==='pending') list=list.filter(t=>t.status==='pending');
  else if(f==='done') list=list.filter(t=>t.status==='done');
  else if(f==='high') list=list.filter(t=>t.priority==='high'&&t.status!=='done');
  else if(f==='overdue') list=list.filter(t=>isOverdue(t));
  list.sort((a,b)=>{
    if(a.status!==b.status) return a.status==='pending'?-1:1;
    return ({high:0,medium:1,low:2}[a.priority]||1)-({high:0,medium:1,low:2}[b.priority]||1);
  });
  const el=document.getElementById('admin-task-list');
  if(!list.length){el.innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div>No tasks here</div></div>`;return;}
  el.innerHTML=list.map(t=>`
    <div class="task-card ${t.status==='done'?'done':''}">
      <div class="tc-top">
        <div class="tc-check ${t.status==='done'?'checked':''}" onclick="toggleDone('${t.id}')">
          ${t.status==='done'?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>':''}
        </div>
        <div class="tc-title ${t.status==='done'?'striked':''}">${t.title}</div>
      </div>
      <div class="tc-meta">
        ${t.assignee?`<span class="badge b-assignee">👤 ${t.assignee}</span>`:''}
        ${prioBadge(t.priority)}
        <span class="badge ${t.status==='done'?'b-done':'b-pending'}">${t.status==='done'?'✓ Done':'● Pending'}</span>
        ${dueBadge(t.due)}
      </div>
      ${t.desc?`<div class="tc-desc">${t.desc}</div>`:''}
      ${t.delayReason?`<div style="background:#f59e0b15;border:1px solid #f59e0b30;border-radius:8px;padding:8px 12px;font-size:12px;color:#fbbf24;margin-bottom:8px">⏰ <strong>Delay reason:</strong> ${t.delayReason}</div>`:''}
      <div class="tc-footer">
        <span class="tc-date">${t.createdAt||''}</span>
        <div class="tc-actions">
          <button class="btn btn-sm btn-ghost" onclick="openEdit('${t.id}')">✏️ Edit</button>
          <button class="btn btn-sm btn-danger" onclick="delTask('${t.id}')">🗑️</button>
        </div>
      </div>
    </div>`).join('');
}

// ── Member tasks ───────────────────────
function renderMemberTasks(){
  const name = window._memberName;
  const el = document.getElementById('member-task-content');
  if(!name){el.innerHTML='';return;}
  const mine = taskArr().filter(t=>t.assignee===name);
  const pending = mine.filter(t=>t.status==='pending');
  const done = mine.filter(t=>t.status==='done');
  el.innerHTML = `
    <div class="member-header">
      <div class="member-name">${name}</div>
      <div class="member-sub">${pending.length} pending · ${done.length} done</div>
    </div>
    ${!mine.length?`<div class="empty"><div class="empty-icon">🎉</div><div>No tasks assigned yet!</div></div>`:''}
    ${pending.length?`<div class="section-label">Pending</div>${pending.map(t=>memberCard(t)).join('')}`:''}
    ${done.length?`<div class="section-label" style="margin-top:16px">Done ✓</div>${done.map(t=>memberCard(t)).join('')}`:''}`;
}

function memberCard(t){
  return `<div class="task-card ${t.status==='done'?'done':''}">
    <div class="tc-top">
      <div class="tc-check ${t.status==='done'?'checked':''}" onclick="toggleDone('${t.id}')">
        ${t.status==='done'?'<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>':''}
      </div>
      <div class="tc-title ${t.status==='done'?'striked':''}">${t.title}</div>
    </div>
    <div class="tc-meta">${prioBadge(t.priority)}${dueBadge(t.due)}</div>
    ${t.desc?`<div class="tc-desc">${t.desc}</div>`:''}
    ${t.delayReason?`<div style="background:#f59e0b15;border:1px solid #f59e0b30;border-radius:8px;padding:8px 12px;font-size:12px;color:#fbbf24;margin-top:4px">⏰ <strong>Delay reason:</strong> ${t.delayReason}</div>`:''}
  </div>`;
}

// ── Member list (team tab) ─────────────
function renderMemberList(){
  const el = document.getElementById('member-list');
  if(!window._members.length){el.innerHTML=`<div class="empty"><div class="empty-icon">👥</div><div>No members yet</div></div>`;return;}
  el.innerHTML = window._members.map((m,i)=>{
    const mine=taskArr().filter(t=>t.assignee===m), done=mine.filter(t=>t.status==='done').length;
    return `<div class="card" style="display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px">
      <div style="width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0">${m[0].toUpperCase()}</div>
      <div style="flex:1"><div style="font-weight:700">${m}</div><div style="font-size:12px;color:var(--text2)">${mine.length} tasks · ${done} done</div></div>
      <button class="btn btn-sm btn-danger" onclick="removeMember(${i})">Remove</button>
    </div>`;
  }).join('');
}

// ── Render all ─────────────────────────
function renderAll(){
  if(window._role==='admin'){ renderStats(); renderAdminTasks(); renderMemberList(); }
  else if(window._role==='member'){ renderMemberTasks(); }
}
window.renderAll = renderAll;

// ── Actions ────────────────────────────
window.createTask = async function(){
  const title = document.getElementById('t-title').value.trim();
  if(!title){toast('⚠️ Title required!');return;}
  const assignee = document.getElementById('t-assign').value;
  await push(ref(db,'tasks'),{
    title, desc:document.getElementById('t-desc').value.trim(),
    assignee, priority:document.getElementById('t-priority').value,
    due:document.getElementById('t-due').value||'',
    status:'pending',
    createdAt:new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})
  });
  document.getElementById('t-title').value='';
  document.getElementById('t-desc').value='';
  document.getElementById('t-due').value='';
  toast('✅ Task created!');
  if(assignee) sendNotif(`New task for ${assignee}`, title);
  // Switch to dashboard to see task
  setTab('dashboard', document.querySelector('#admin-tabs .tab-btn'));
};

window.toggleDone = async function(id){
  const t = window._tasks[id];
  if(!t) return;
  const ns = t.status==='done'?'pending':'done';
  if(ns==='done' && isOverdue(t)){
    showDelayModal(id, t);
    return;
  }
  await update(ref(db,`tasks/${id}`),{status:ns, delayReason: ns==='pending'?'':(t.delayReason||'')});
  toast(ns==='done'?'✅ Marked done!':'↩️ Marked pending');
  if(ns==='done') sendNotif('Task completed! 🎉', t.title);
};

function showDelayModal(id, t){
  const m = document.createElement('div');
  m.className='modal-bg open';
  m.innerHTML=`<div class="modal">
    <div class="modal-title">⏰ Task Delayed</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px">
      "<strong style="color:var(--text)">${t.title}</strong>" due date దాటిపోయింది.<br/>Delay reason చెప్పు:
    </div>
    <div class="field">
      <label>Reason *</label>
      <textarea id="delay-reason-input" placeholder="e.g. Content research time ekkuva padindi..." style="min-height:90px"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="this.closest(\'.modal-bg\').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="submitDelayReason(''+id+'',this)">Submit & Mark Done</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  setTimeout(()=>m.querySelector('textarea').focus(),100);
}

window.submitDelayReason = async function(id, btn){
  const reason = document.getElementById('delay-reason-input').value.trim();
  if(!reason){toast('⚠️ Reason required!');return;}
  const t = window._tasks[id];
  await update(ref(db,`tasks/${id}`),{status:'done', delayReason:reason});
  btn.closest('.modal-bg').remove();
  toast('✅ Done! Reason saved.');
  sendNotif('Task completed! 🎉', t.title);
};

window.delTask = async function(id){
  if(!confirm('Delete this task?')) return;
  await remove(ref(db,`tasks/${id}`));
  toast('🗑️ Deleted');
};

window.addMember = async function(){
  const inp = document.getElementById('new-member');
  const name = inp.value.trim();
  if(!name){toast('Enter a name!');return;}
  if(window._members.includes(name)){toast('Already exists!');return;}
  await set(ref(db,'members'), [...window._members, name]);
  inp.value='';
  toast(`👤 ${name} added!`);
};

window.removeMember = async function(i){
  if(!confirm(`Remove ${window._members[i]}?`)) return;
  await set(ref(db,'members'), window._members.filter((_,j)=>j!==i));
  toast('Removed');
};

window.changePassword = async function(){
  const np = document.getElementById('new-pass').value.trim();
  if(!np||np.length<4){toast('Password min 4 characters!');return;}
  await set(ref(db,'settings/adminPass'), np);
  document.getElementById('new-pass').value='';
  toast('🔑 Password updated!');
};

// ── Edit modal ─────────────────────────
window.openEdit = function(id){
  const t = window._tasks[id];
  if(!t) return;
  const m = document.createElement('div');
  m.className='modal-bg open';
  m.innerHTML=`<div class="modal">
    <div class="modal-title">✏️ Edit Task</div>
    <div class="field"><label>Title</label><input id="e-title" value="${t.title}"/></div>
    <div class="field"><label>Description</label><textarea id="e-desc">${t.desc||''}</textarea></div>
    <div class="row2">
      <div class="field"><label>Assign To</label>
        <select id="e-assign">
          <option value="">— none —</option>
          ${window._members.map(mm=>`<option value="${mm}" ${t.assignee===mm?'selected':''}>${mm}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Priority</label>
        <select id="e-priority">
          <option value="high" ${t.priority==='high'?'selected':''}>🔴 High</option>
          <option value="medium" ${t.priority==='medium'?'selected':''}>🟡 Medium</option>
          <option value="low" ${t.priority==='low'?'selected':''}>🟢 Low</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Due Date</label><input type="date" id="e-due" value="${t.due||''}"/></div>
    <div class="modal-actions">
      <button class="btn" onclick="this.closest('.modal-bg').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit('${id}',this)">Save</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
};

window.saveEdit = async function(id, btn){
  const u={title:document.getElementById('e-title').value.trim(),desc:document.getElementById('e-desc').value.trim(),assignee:document.getElementById('e-assign').value,priority:document.getElementById('e-priority').value,due:document.getElementById('e-due').value||''};
  if(!u.title){toast('Title required!');return;}
  await update(ref(db,`tasks/${id}`),u);
  btn.closest('.modal-bg').remove();
  toast('✅ Updated!');
};

// ── Tabs ───────────────────────────────
window.setTab = function(tab, el){
  ['dashboard','create','team','mytasks'].forEach(t=>{
    const c=document.getElementById('tab-'+t);
    if(c) c.style.display=t===tab?'':'none';
  });
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
};

window.setFilter = function(f, el){
  window._adminFilter=f;
  document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  renderAdminTasks();
};

// ── Notifications ──────────────────────
function sendNotif(title, body){
  if(Notification.permission==='granted') new Notification(title,{body,icon:'https://vibhillionai.com/favicon.ico'});
}

window.enableNotifs = async function(){
  const p = await Notification.requestPermission();
  if(p==='granted'){document.getElementById('notif-bar').style.display='none';toast('🔔 Notifications enabled!');}
};

function checkNotifBanner(){
  if(Notification.permission==='default') document.getElementById('notif-bar').style.display='flex';
}

// ── Service Worker ─────────────────────
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ── Init default members ───────────────
onValue(ref(db,'members'), snap=>{
  if(!snap.val()) set(ref(db,'members'),['Ravi','Priya','Suresh','Kavya']);
},{onlyOnce:true});

</script>
</body>
</html>
